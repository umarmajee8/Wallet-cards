    <script>
      // light or dark before anything is drawn – the app re-checks once it runs
      (function () {
        try {
          var s = JSON.parse(localStorage.getItem('wallet.settings.v1') || '{}')
          var m = s.appearance || 'system'
          var q = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)')
          if (m === 'dark' || (m === 'system' && q && q.matches)) {
            document.documentElement.classList.add('dark')
          }
        } catch (e) {}
      })()
    </script>
